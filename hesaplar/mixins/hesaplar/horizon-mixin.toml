[mod]
id = "hesaplar"
version = "16.10.1"
priority = 100

# Pinned to the same Horizon commit as the other 16.10.x mods.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The sign-in chain, the account list and the menu (plain Rust, core.rs).
[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "hesaplar_core"
source = "core.rs"
visibility = "pub(crate)"

# The mod's state, curl / DPAPI and its reach into the game (state.rs).
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "hesaplar"
source = "state.rs"
visibility = "pub(crate)"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The account button on every menu screen out of a world, and the account
# menu (the mod's own screen) dropped down under it.
[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "keys"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_key_pressed_pre"
helper = "keys.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "chars"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_char_typed_pre"
helper = "chars.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]