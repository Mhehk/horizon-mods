[mod]
id = "opsec"
version = "16.10.1"
priority = 100

# Pinned to nightly-source/2026-11-13-9f42064: the server's packets are
# internal, not catalogued hook points (as BetterHitreg's `handle_packet`).
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The resource pack guard (see guard.rs).
[[module]]
id = "guard"
file = "crates/horizon-client/src/game/remote.rs"
name = "opsec_guard"
source = "guard.rs"
visibility = "pub(crate)"

[[injection]]
id = "packet"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&C", value = "&packet" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
